baseURL = "https://kode4food.github.io/argex/"
locale = "en-us"
title = "Argyll Expressions"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  style = "catppuccin-macchiato"

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"

[params]
  BookTheme = "argex-auto"
  BookSearch = true
  BookToC = true
  BookRepo = "https://github.com/kode4food/argex"
  BookEditPath = "edit/main/docs/content"
